# Quick checks on every push and pull request: no Docker, no image, synthetic data only
# (host/ci-quick.sh). The container steps, cite-check, and the gate run locally with
# ./cupella check.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"   # the image's Python (./cupella versions)
      - name: Quick checks
        run: host/ci-quick.sh
      - name: Output of the checks
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ci-quick
          path: work/_ci/*.txt
          if-no-files-found: ignore
